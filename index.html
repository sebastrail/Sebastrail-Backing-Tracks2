<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Repertorio · Sebastrail</title>
  <meta name="description" content="Repertorio de Sebastrail: canciones con stems para ensayar, con mute, solo y transporte por pista.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='16' fill='%23fae8ed'/%3E%3Cpath d='M18 5 10 18h6l-2 9 8-13h-6z' fill='%23b76478'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <!-- Flor de cerezo reutilizable -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="sakura" viewBox="-50 -50 100 100">
      <g fill="currentColor">
        <path id="petalo" d="M0 -6 C -14 -16 -16 -34 -8 -44 L 0 -38 L 8 -44 C 16 -34 14 -16 0 -6 Z"/>
        <use href="#petalo" transform="rotate(72)"/>
        <use href="#petalo" transform="rotate(144)"/>
        <use href="#petalo" transform="rotate(216)"/>
        <use href="#petalo" transform="rotate(288)"/>
      </g>
      <circle r="5" fill="#e7a3b6"/>
    </symbol>
  </svg>

  <header class="barra-superior">
    <a href="#/" class="marca" aria-label="Repertorio de Sebastrail: ir al catálogo">
      <img src="img/logo.png" alt="Sebastrail" width="161" height="15">
      <span class="marca-separador" aria-hidden="true"></span>
      <span class="marca-texto" id="nombre-proyecto">Repertorio</span>
    </a>
    <nav class="barra-enlaces">
      <span class="barra-ayuda">Espacio: play/pausa · ← → ±5 s</span>
      <a href="#/">Catálogo</a>
      <a href="https://sebastrail.com" target="_blank" rel="noopener">Sitio ↗</a>
    </nav>
  </header>

  <!-- Vista: catálogo -->
  <main id="vista-catalogo" class="vista" hidden>
    <span class="flor flor-1" aria-hidden="true"><svg><use href="#sakura"/></svg></span>
    <span class="flor flor-2" aria-hidden="true"><svg><use href="#sakura"/></svg></span>
    <span class="flor flor-3" aria-hidden="true"><svg><use href="#sakura"/></svg></span>

    <section class="catalogo-cabecera">
      <span class="etiqueta">Sebastrail · Material de ensayo</span>
      <h1>Repertorio</h1>
      <p id="descripcion-proyecto"></p>
      <input id="buscador" type="search" placeholder="Buscar canción…" aria-label="Buscar canción">
    </section>

    <section class="marco catalogo-marco">
      <div class="marco-interior">
        <div id="secciones-catalogo"></div>
      </div>
    </section>

    <footer class="pie">Hikari Records · <a href="https://sebastrail.com" target="_blank" rel="noopener">sebastrail.com</a></footer>
  </main>

  <!-- Vista: reproductor -->
  <main id="vista-reproductor" class="vista" hidden>
    <span class="flor flor-1" aria-hidden="true"><svg><use href="#sakura"/></svg></span>
    <span class="flor flor-2" aria-hidden="true"><svg><use href="#sakura"/></svg></span>

    <section class="cancion-cabecera">
      <div class="cancion-titulos">
        <a href="#/" class="boton-volver" aria-label="Volver al catálogo">
          <svg viewBox="0 0 24 24" width="14" height="14"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Catálogo
        </a>
        <h1 id="titulo-cancion"></h1>
        <p id="meta-cancion" class="meta"></p>
      </div>
      <button id="boton-restablecer" class="boton-pildora" type="button">Restablecer mezcla</button>
    </section>

    <div id="carga" class="carga">
      <div class="carga-barra"><div id="carga-relleno"></div></div>
      <p id="carga-texto">Cargando pistas…</p>
    </div>

    <section id="mezclador-marco" class="marco mezclador-marco" hidden>
      <div id="mezclador" class="mezclador">
        <div class="columna-controles">
          <div class="esquina-regla"><span class="etiqueta">Pistas</span></div>
          <div id="controles-pistas"></div>
        </div>
        <div id="columna-ondas" class="columna-ondas">
          <canvas id="regla" class="regla"></canvas>
          <div id="ondas-pistas"></div>
          <div id="atenuador" class="atenuador"></div>
          <div id="cabezal" class="cabezal"><span></span></div>
          <div id="hover" class="hover-linea"></div>
        </div>
        <div id="columna-partitura" class="columna-partitura" hidden>
          <div class="partitura-cabecera">
            <span class="etiqueta">Partitura</span>
            <strong id="partitura-nombre"></strong>
            <button id="boton-ver-ondas" class="boton-pildora boton-ondas" type="button">Ver ondas</button>
          </div>
          <div id="partitura-desplazable" class="partitura-desplazable">
            <div id="partitura-paginas" class="partitura-paginas"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Barra de transporte -->
  <footer id="transporte" class="transporte" hidden>
    <div class="transporte-botones">
      <button id="boton-play" class="boton-transporte principal" type="button" aria-label="Reproducir" title="Play / pausa (Espacio)">
        <svg class="icono-play" viewBox="0 0 24 24" width="22" height="22"><path d="M8.5 5.5v13a1 1 0 0 0 1.5.86l10-6.5a1 1 0 0 0 0-1.72l-10-6.5a1 1 0 0 0-1.5.86z" fill="currentColor"/></svg>
        <svg class="icono-pausa" viewBox="0 0 24 24" width="22" height="22"><rect x="6.5" y="5" width="4" height="14" rx="1.5" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.5" fill="currentColor"/></svg>
      </button>
      <button id="boton-stop" class="boton-transporte" type="button" aria-label="Stop" title="Stop (volver al inicio)">
        <svg viewBox="0 0 24 24" width="16" height="16"><rect x="6" y="6" width="12" height="12" rx="2.5" fill="currentColor"/></svg>
      </button>
    </div>
    <span id="tiempo-actual" class="tiempo">0:00</span>
    <div id="linea-tiempo" class="linea-tiempo" role="slider" tabindex="0" aria-label="Posición de la canción" aria-valuemin="0">
      <div class="linea-pista"><div id="linea-progreso" class="linea-progreso"></div></div>
      <div id="linea-perilla" class="linea-perilla"></div>
    </div>
    <span id="tiempo-total" class="tiempo">0:00</span>
    <label class="volumen-maestro" title="Volumen general">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input id="volumen-maestro" type="range" min="0" max="1.5" step="0.01" value="1" aria-label="Volumen general">
    </label>
  </footer>

  <template id="plantilla-control">
    <div class="control-pista">
      <span class="color-pista"></span>
      <div class="control-cuerpo">
        <div class="control-fila">
          <span class="nombre-pista"></span>
          <span class="botones-ms">
            <button class="boton-m" type="button" aria-pressed="false" title="Mute">M</button>
            <button class="boton-s" type="button" aria-pressed="false" title="Solo (Alt/⌥ + clic: solo exclusivo)">S</button>
            <button class="boton-p" type="button" aria-pressed="false" title="Ver partitura" hidden>
              <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M9 5.6 19 3.2v3.1L9 8.7z" fill="currentColor"/><path d="M8.2 7.2h1.6v10h-1.6zm10 -2.4h1.6v10h-1.6z" fill="currentColor"/><ellipse cx="6.4" cy="17.4" rx="3.1" ry="2.3" transform="rotate(-22 6.4 17.4)" fill="currentColor"/><ellipse cx="16.4" cy="15" rx="3.1" ry="2.3" transform="rotate(-22 16.4 15)" fill="currentColor"/></svg>
            </button>
          </span>
        </div>
        <input class="volumen-pista" type="range" min="0" max="1.5" step="0.01" value="1">
      </div>
    </div>
  </template>

  <script type="module" src="js/app.js"></script>
</body>
</html>
